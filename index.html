<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Drive in Traffic</title>
<!-- YouTube Playables: uncomment when the game is hosted on YouTube (the SDK must load before the game code). -->
<!-- <script src="https://www.youtube.com/game_api/v1"></script> -->
<style>
  :root { --navy: #121833; --navy2: #1b2350; --line: #3fd0ff; --green: #3ccf4e; --green-d: #23902f; --gold: #ffc83a; --pink: #ff3cbe; --text: #fff; --muted: #a9b3cf; --red: #ff4a4a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f1f; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  button { font-family: inherit; font-weight: 900; cursor: pointer; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }
  .panel { background: linear-gradient(180deg, rgba(27,35,80,.94), rgba(18,24,51,.94)); border: 2px solid rgba(63,208,255,.55); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .pill { background: rgba(18,24,51,.88); border: 2px solid rgba(63,208,255,.45); border-radius: 999px; padding: 6px 14px; font-size: 15px; white-space: nowrap; }
  .cash { color: #fff; background: linear-gradient(180deg, #2c9e3a, #1d7a2a); border-color: #6dff7e; font-size: 18px; }
  .big-btn { pointer-events: auto; border: 0; border-radius: 14px; background: linear-gradient(180deg, #5be36a, var(--green)); color: #fff; font-size: 30px; letter-spacing: 1px;
    padding: 14px 0; width: min(300px, 78vw); box-shadow: 0 6px 0 var(--green-d), 0 10px 22px rgba(0,0,0,.35); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-d); }
  .big-btn.buy { background: linear-gradient(180deg, #ffd85a, var(--gold)); color: #3a2a00; box-shadow: 0 6px 0 #b58a12; text-shadow: none; }
  .big-btn small { display: block; font-size: 16px; margin-top: 2px; }
  .big-btn:disabled { background: #59607a; color: #c9cfe0; box-shadow: 0 6px 0 #3a4058; }
  .ghost { pointer-events: auto; border: 2px solid rgba(63,208,255,.6); border-radius: 12px; background: rgba(18,24,51,.85); color: #fff; font-size: 14px; padding: 9px 14px; }
  /* lobby */
  #lobbyUi { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: 12px 16px 18px; }
  #topbar { display: flex; align-items: center; gap: 8px; }
  #topbar .grow { flex: 1; }
  #setBtn { pointer-events: auto; width: 40px; height: 36px; border-radius: 10px; border: 2px solid rgba(63,208,255,.45); background: rgba(18,24,51,.88); color: #fff; font-size: 16px; }
  #title { text-align: center; margin-top: 8px; font-size: clamp(26px, 6vw, 40px); font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #0b0f1f, 0 0 18px rgba(63,208,255,.6); }
  #title b { color: var(--gold); }
  #mid { display: flex; align-items: center; justify-content: space-between; }
  .arrow { pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(63,208,255,.7); background: rgba(18,24,51,.85); color: #fff; font-size: 26px; }
  #bottomRow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  #statsPanel { pointer-events: auto; width: min(330px, 100%); padding: 12px 14px; }
  #selName { font-size: 24px; font-weight: 900; line-height: 1; }
  #selRarity { display: inline-block; margin-top: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--green); }
  .stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin-top: 10px; }
  .stat .sn { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .stat .sn span { color: #fff; }
  .stat .sb { grid-column: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
  .stat .sb i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe58a); }
  .stat .pips { grid-column: 1; display: flex; gap: 3px; }
  .stat .pips b { width: 14px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.15); }
  .stat .pips b.on { background: var(--gold); }
  .stat button { grid-column: 2; grid-row: 1 / span 3; border: 0; border-radius: 10px; background: linear-gradient(180deg, #5be36a, var(--green)); color: #fff; font-size: 13px; padding: 8px 10px; box-shadow: 0 3px 0 var(--green-d); }
  .stat button:disabled { background: #59607a; box-shadow: 0 3px 0 #3a4058; color: #c9cfe0; }
  #playCol { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #tags .tag { position: fixed; left: 0; top: 0; text-align: center; padding: 5px 12px; border-radius: 10px; background: rgba(18,24,51,.85); border: 2px solid rgba(255,200,58,.6); white-space: nowrap; font-size: 12px; transition: opacity .2s; opacity: .8; }
  #tags .tag .tn { font-size: 14px; font-weight: 900; }
  #tags .tag .st { color: var(--gold); }
  #tags .tag.sel { opacity: 1; transform-origin: bottom; font-size: 14px; border-color: var(--gold); }
  #tags .tag.sel .tn { font-size: 18px; }
  @media (max-aspect-ratio: 1/1) {
    #bottomRow { flex-direction: column; align-items: stretch; }
    #statsPanel { width: 100%; padding: 10px 12px; }
    .stat { margin-top: 6px; }
    #playCol { align-items: stretch; }
    .big-btn { width: 100%; }
  }
  /* run HUD */
  #hud { padding: 10px 14px; }
  #hudTop { display: flex; align-items: center; gap: 10px; }
  #pauseBtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 10px; border: 2px solid rgba(63,208,255,.45); background: rgba(18,24,51,.8); color: #fff; font-size: 14px; }
  #progress { flex: 1; }
  #progress .row { display: flex; justify-content: space-between; font-size: 13px; text-shadow: 0 1px 3px #000; }
  #bar { height: 9px; border-radius: 5px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 3px; border: 1px solid rgba(255,255,255,.25); }
  #barFill { height: 100%; width: 0; background: linear-gradient(90deg, var(--line), var(--pink)); }
  #comboHud { position: absolute; left: 0; right: 0; top: 64px; text-align: center; font-size: 22px; color: var(--gold); text-shadow: 0 2px 6px #000; }
  #speedBox { position: absolute; left: 16px; top: 58px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #speedHud { font-size: 32px; font-weight: 900; line-height: 1; }
  #speedHud small { font-size: 14px; color: var(--muted); margin-left: 4px; }
  #gearBox { font-size: 14px; color: var(--muted); }
  #gearHud { color: #fff; font-size: 20px; }
  #nitroBox { position: absolute; right: 16px; top: 58px; width: 130px; font-size: 11px; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  #nitroBar { height: 9px; margin-top: 3px; border-radius: 5px; background: rgba(0,0,0,.35); overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  #nitroFill { height: 100%; width: 40%; background: linear-gradient(90deg, #2fd3ff, #8cf0ff); }
  body.nitro #nitroFill { box-shadow: 0 0 12px #2fd3ff; }
  #hint { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: max-content; max-width: min(420px, calc(100% - 180px)); text-align: center; font-size: 14px; padding: 7px 12px; border-radius: 12px;
    background: rgba(18,24,51,.82); border: 2px solid rgba(63,208,255,.6); transition: opacity .4s; }
  #brief { position: absolute; left: 50%; top: 52px; transform: translate(-50%, -20px); width: min(380px, calc(100% - 180px)); min-width: 240px; text-align: center; padding: 8px 14px; border-radius: 14px;
    background: rgba(18,24,51,.9); border: 2px solid var(--gold); box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .35s, transform .35s; }
  #brief.show { opacity: 1; transform: translate(-50%, 0); } #brief.out { opacity: 0; transform: translate(-50%, -20px); }
  #brief .bt { font-size: 13px; color: var(--muted); } #brief .bg { margin-top: 6px; font-size: 12px; letter-spacing: 2px; color: var(--gold); }
  #brief .bo { font-size: 18px; font-weight: 900; margin-top: 2px; } #brief .bh { font-size: 12px; color: #cfe8ff; margin-top: 6px; } #brief .br { font-size: 13px; margin-top: 8px; color: var(--muted); } #brief .br b { color: var(--gold); }
  #lvlHud { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
  #fxl { pointer-events: none; overflow: hidden; }
  #speedfx { position: absolute; inset: -20%; opacity: 0; background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,255,255,0) 0deg 2.6deg, rgba(255,255,255,.5) 2.6deg 2.9deg, rgba(255,255,255,0) 2.9deg 7deg);
    -webkit-mask: radial-gradient(circle at 50% 45%, transparent 30%, #000 70%); mask: radial-gradient(circle at 50% 45%, transparent 30%, #000 70%); animation: sfx .12s steps(3) infinite; }
  @keyframes sfx { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(1.3deg) scale(1.03); } 100% { transform: rotate(-1deg) scale(1.01); } }
  body.nitro #speedfx { filter: drop-shadow(0 0 4px #2fd3ff) hue-rotate(0deg); }
  #vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,10,.75) 100%); }
  #flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(255,214,90,.55) 100%); }
  #flash.go { animation: flash .35s ease-out; } @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #hint i { font-style: normal; color: var(--line); margin-right: 6px; }
  .btnRow { display: flex; gap: 8px; }
  .btnRow .ghost { flex: 1; min-width: 0; overflow: hidden; line-height: 1.15; } .tabs .ghost { font-size: 13px; padding: 7px 8px; }
  .tabs .ghost { opacity: .6; } .tabs .ghost.on { opacity: 1; border-color: var(--gold); color: var(--gold); } .tabs .ghost.locked { opacity: .35; }
  #mapTop { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
  #lvlTop { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #mapTop { max-width: 100%; min-width: 0; box-sizing: border-box; } #mapName { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; } #playCol, #playCol > * { min-width: 0; max-width: 100%; }
  .mini.list { font-size: 20px; color: var(--gold); }
  .mini { border: 0; background: none; color: var(--line); font-size: 16px; padding: 0 4px; }
  .stars b { color: rgba(255,255,255,.22); font-size: 1em; }
  .stars b.on { color: var(--gold); text-shadow: 0 0 8px rgba(255,200,58,.6); }
  #resOver .stars { font-size: 40px; letter-spacing: 6px; }
  #career .panel, #settings .panel { width: min(760px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  #settings { z-index: 5; }
  #mapMenu .panel { width: min(900px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  #mapGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; overflow-y: auto; padding: 4px; margin: 12px 0; }
  .mapcard { position: relative; pointer-events: auto; padding: 0; border: 3px solid rgba(90,110,180,.7); border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 9; background: #121630 center / cover no-repeat; color: #fff; transition: transform .12s; }
  .mapcard:active { transform: scale(.96); } .mapcard.sel { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,200,58,.45); }
  .mapcard .mnm { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 7px; text-align: left; font-size: 19px; font-weight: 900; letter-spacing: .5px; background: linear-gradient(transparent, rgba(5,8,22,.85)); text-shadow: 0 2px 4px #000; }
  .mapcard .mtag { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 999px; background: var(--gold); color: #2a1e00; font-size: 11px; font-weight: 900; }
  @media (max-aspect-ratio: 1/1) { #brief, #hint { top: 96px; } }
  @media (max-aspect-ratio: 1/1) { #mapGrid { grid-template-columns: 1fr 1fr; gap: 8px; } .mapcard .mnm { font-size: 15px; } }
  #settings .panel { width: min(400px, 100%); }
  #adminBtn { pointer-events: auto; height: 36px; padding: 0 10px; margin-right: 6px; border-radius: 10px; border: 2px solid #ff3cbe; background: rgba(18,24,51,.88); color: #ff9be0; font-weight: 800; }
  #adminRows { display: grid; gap: 8px; margin: 12px 0; } .adminAct { padding: 10px; border-radius: 10px; border: 2px solid rgba(63,208,255,.45); background: rgba(18,24,51,.9); color: #fff; font-size: 15px; font-weight: 700; }
  #admin .panel { max-height: calc(100vh - 32px); overflow: auto; }
  #careerGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; overflow-y: auto; padding: 4px; margin: 12px 0; text-align: left; }
  .mcard { position: relative; pointer-events: auto; border: 2px solid rgba(90,110,180,.7); border-radius: 12px; background: linear-gradient(180deg, #2e3868, #121630); color: #fff; padding: 10px 12px; text-align: left; font-size: 13px; }
  .mcard.sel { border-color: var(--gold); background: linear-gradient(180deg, #4668be, #182456); }
  .mcard .mh { display: flex; justify-content: space-between; color: var(--line); font-size: 12px; }
  .mcard .mn { font-size: 18px; margin: 4px 0; text-transform: uppercase; }
  .mcard .mo { color: #d2daf0; font-weight: 600; min-height: 34px; }
  .mcard .mf { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); }
  .mcard .mr { color: #7dff8a; }
  .mcard.locked .mo, .mcard.locked .mn { visibility: hidden; }
  .mcard .lock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; border-radius: 10px; background: rgba(6,8,22,.55); color: var(--muted); font-size: 14px; }
  .vrow { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; margin: 14px 0; text-align: left; }
  .vrow input { width: 100%; accent-color: var(--line); height: 28px; }
  .pop { position: absolute; transform: translate(-50%, -50%); font-size: 20px; font-weight: 900; color: #7dff8a; text-shadow: 0 2px 6px #000; animation: pop 1s ease-out forwards; white-space: nowrap; }
  .pop.near { color: var(--gold); font-size: 26px; }
  @keyframes pop { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }
  #toast { position: absolute; left: 0; right: 0; top: 26%; text-align: center; font-size: 28px; color: var(--gold); text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .3s; }
  /* touch controls */
  #touchUi .tb { position: absolute; pointer-events: auto; border: 2px solid rgba(255,255,255,.55); background: rgba(18,24,51,.45); color: #fff; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; touch-action: none; }
  #touchUi .tb::before { content: ''; position: absolute; inset: -16px; border-radius: 50%; } /* bigger hit area than the drawing */
  #touchUi .tb { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #touchUi .tb.dim { opacity: .6; }
  #touchUi #tNitro { background: conic-gradient(rgba(47,211,255,.55) var(--fill, 0deg), rgba(18,24,51,.45) 0); }
  #touchUi #tNitro:not(.dim) { box-shadow: 0 0 14px #2fd3ff; }
  #touchUi .tb.on { transform: scale(.92); }
  #touchUi .tb.nope { animation: nope .3s; } @keyframes nope { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
  #touchUi .tb.on { background: rgba(63,208,255,.55); }
  #joyZone { position: absolute; left: 0; bottom: 0; width: 45%; height: 70%; pointer-events: auto; touch-action: none; }
  #joyBase { position: absolute; width: var(--jb); height: var(--jb); margin: calc(var(--jb) / -2) 0 0 calc(var(--jb) / -2); border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(18,24,51,.28); opacity: .55; transition: opacity .15s; }
  #joyBase.on { opacity: 1; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: calc(var(--jb) * .44); height: calc(var(--jb) * .44); transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #touchUi { --jb: min(176px, 40vh); }
  #touchUi #tNitro { right: 16px; bottom: 18px; width: 80px; height: 80px; font-size: 13px; border-color: #2fd3ff !important; }
  #touchUi #tBrake { right: 112px; bottom: 16px; width: 64px; height: 64px; font-size: 11px; border-color: var(--red) !important; opacity: .85; }
  #touchUi #tCam { right: 20px; bottom: 120px; width: 48px; height: 48px; font-size: 11px; opacity: .8; }
  /* modals */
  @media (max-height: 460px) and (min-aspect-ratio: 1/1) {
    #lobbyUi { padding: 8px 12px 10px; }
    #title, #tags { display: none; }
    .pill { padding: 4px 10px; font-size: 13px; } .cash { font-size: 15px; } #setBtn { height: 30px; width: 34px; }
    #statsPanel { width: min(290px, 44vw); padding: 8px 10px; } #selName { font-size: 18px; } #selRarity { margin-top: 3px; font-size: 10px; padding: 2px 8px; }
    .stat { margin-top: 4px; gap: 2px 8px; } .stat .sn { font-size: 11px; } .stat button { padding: 5px 8px; font-size: 12px; }
    #playCol { gap: 6px; width: min(330px, 48vw); } #playCol > * { width: 100%; }
    .ghost { padding: 6px 10px; font-size: 12px; } .big-btn { font-size: 22px; padding: 9px 0; width: 100%; }
    .arrow { width: 40px; height: 40px; font-size: 18px; }
    #brief { top: 46px; } #brief .bt, #brief .br { display: none; }
    #mapGrid { grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; } .modal .panel { padding: 12px; } .modal h2 { font-size: 20px; margin-bottom: 4px; } .mapcard .mnm { font-size: 13px; padding: 12px 6px 4px; } .mapcard { aspect-ratio: auto; height: 68px; } #mapGrid { flex: 0 0 auto; } #mapMenuSub { display: none; }
  }
  .modal { pointer-events: auto; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.45); padding: 16px; }
  .modal .panel { width: min(400px, 100%); padding: 22px; text-align: center; }
  .modal h2 { font-size: 26px; margin-bottom: 10px; }
  .modal .sub { color: var(--muted); font-size: 15px; }
  #result { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: auto; background: rgba(0,0,0,.25); padding: 16px; }
  #result .panel { padding: 20px 26px; text-align: center; width: min(420px, 100%); }
  #resTitle { font-size: clamp(30px, 8vw, 46px); font-weight: 900; }
  #resCash { font-size: 34px; color: #7dff8a; margin-top: 10px; }
  #loading { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #0b0f1f; pointer-events: auto; }
</style>
</head>
<body>
<div id="lobbyUi" class="layer hidden">
  <div>
    <div id="topbar"><div class="pill" id="lvlTop"></div><div class="grow"></div><div class="pill cash" id="cashTop"></div><button id="setBtn" aria-label="Sound"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button></div>
    <div id="title">DRIVE IN <b>TRAFFIC</b></div>
  </div>
  <div id="mid"><button class="arrow" id="prevBike" aria-label="Previous bike">◀</button><button class="arrow" id="nextBike" aria-label="Next bike">▶</button></div>
  <div id="bottomRow">
    <div id="statsPanel" class="panel"><div id="selName"></div><div id="selRarity"></div><div id="statRows"></div></div>
    <div id="playCol">
      <div class="btnRow tabs"><button class="ghost" id="modeCareer"></button><button class="ghost" id="modeEndless"></button></div>
      <div class="pill" id="mapTop"><button class="mini list" id="careerBtn">☰</button><span id="mapName"></span></div>
      <button class="ghost" id="viewBtn"></button>
      <button class="big-btn" id="mainBtn"></button>
    </div>
  </div>
</div>
<div id="tags" class="layer"></div>
<div id="fxl" class="layer"><div id="speedfx"></div><div id="vignette"></div><div id="flash"></div></div>
<div id="hud" class="layer hidden">
  <div id="hudTop"><button id="pauseBtn" aria-label="Pause">II</button>
    <div id="progress"><div class="row"><span id="lvlHud"></span><span id="distHud"></span></div><div id="bar"><div id="barFill"></div></div></div>
    <div class="pill cash" id="cashHud"></div></div>
  <div id="nitroBox">NITRO<div id="nitroBar"><div id="nitroFill"></div></div></div>
  <div id="comboHud"></div>
  <div id="hint"></div>
  <div id="brief"></div>
  <div id="speedBox"><div id="speedHud">0<small>km/h</small></div><div id="gearBox">GEAR <span id="gearHud">1</span></div></div>
</div>
<div id="pops" class="layer"></div>
<div class="layer" style="z-index:6"><div id="toast"></div></div>
<div id="touchUi" class="layer hidden">
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div class="tb" id="tBrake">BRAKE</div><div class="tb" id="tNitro">NITRO</div>
  <div class="tb" id="tCam">CAM</div>
